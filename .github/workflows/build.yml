name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Flutter Project
        run: |
          flutter create --org com.autocaption --project-name autocaption_app .

      - name: Overwrite Main and Pubspec
        run: |
          # اینجا مطمئن می‌شویم فایل‌های اصلی سر جای درست قرار دارند
          mkdir -p lib
          # اگر فایلی جا مانده، الان ریسیت و آماده می‌شود
          flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoCaption-APK
          path: build/app/outputs/flutter-apk/app-release.apk
